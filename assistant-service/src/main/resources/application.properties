spring.application.name=assistant-service
server.port=8084

# LLM (API compatible OpenAI). Définir OPENAI_API_KEY ; OPENAI_BASE_URL et OPENAI_MODEL sont optionnels.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Serveurs MCP des micro-services (account-service et transaction-service doivent être démarrés)
spring.ai.mcp.client.name=bank-assistant
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.sse.connections.account.url=http://localhost:8081
spring.ai.mcp.client.sse.connections.transaction.url=http://localhost:8082

management.endpoints.web.exposure.include=health,info
