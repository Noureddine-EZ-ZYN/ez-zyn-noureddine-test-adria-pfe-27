spring.application.name=transaction-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:transactiondb
spring.jpa.hibernate.ddl-auto=update

spring.graphql.graphiql.enabled=true

spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Plafond d'une transaction (sera fourni par le config-service)
bank.transaction.max-amount=1000

# Appel d'account-service
account-service.url=http://localhost:8081
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Resilience4J : disjoncteur sur tous les appels, retry sur la lecture uniquement
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions=ma.adria.bank.transaction.service.BusinessRuleException,ma.adria.bank.transaction.service.AccountNotFoundException
resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=300ms
resilience4j.retry.instances.accountService.retry-exceptions=ma.adria.bank.transaction.service.AccountServiceUnavailableException

management.endpoints.web.exposure.include=health,info,circuitbreakers,retries
management.health.circuitbreakers.enabled=true
