server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: account-rest
          uri: http://localhost:8081
          predicates:
            - Path=/api/accounts/**
        - id: transaction-rest
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**
        - id: account-graphql
          uri: http://localhost:8081
          predicates:
            - Path=/account/graphql
          filters:
            - RewritePath=/account/graphql, /graphql
        - id: transaction-graphql
          uri: http://localhost:8082
          predicates:
            - Path=/transaction/graphql
          filters:
            - RewritePath=/transaction/graphql, /graphql

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway
